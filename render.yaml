services:
  # Single-origin production: the API serves the SPA from client/dist, so
  # session cookies stay first-party (static rewrites drop Set-Cookie).
  # Build bakes VITE_API_URL=/v1 into the client bundle (same-origin calls).
  - type: web
    name: tsa-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build --workspace=@tsa/shared && npm run build --workspace=server && npm run build --workspace=client
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VITE_API_URL
        value: /v1
      # Set these in Render Dashboard → Environment:
      # MONGO_URI
      # SESSION_SECRET
      # CLIENT_URL (single origin, e.g. https://tsa-api-4yew.onrender.com)
      # BREVO_API_KEY
      # EMAIL_OWNER
      # CRON_SECRET
      # CLOUDINARY_CLOUD_NAME
      # CLOUDINARY_API_KEY
      # CLOUDINARY_API_SECRET
      # MEMCACHIER_SERVERS (optional)
      # MEMCACHIER_USERNAME (optional)
      # MEMCACHIER_PASSWORD (optional)