name: CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test, main]

jobs:
  check-source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce test branch only
        run: |
          if [ "${{ github.head_ref }}" != "test" ]; then
            echo "::error::PRs to main must come from the test branch only. Got: ${{ github.head_ref }}"
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck --workspace shared
      - run: npm run typecheck --workspace server
      - run: npm run build --workspace client

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run lint --workspace client